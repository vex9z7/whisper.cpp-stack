services:
  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main
    container_name: whisper-cpp
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WHISPER_PORT:-2022}:2022"
    volumes:
      - ./models:/models:ro
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    command:
      - whisper-server
      - --host
      - 0.0.0.0
      - --port
      - "2022"
      - -m
      - /models/${WHISPER_MODEL_FILE:-ggml-small.bin}
      - --convert
      - --inference-path
      - /v1/audio/transcriptions
      - --processors
      - "${WHISPER_PROCESSORS:-1}"
      - --threads
      - "${WHISPER_THREADS:-4}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:2022/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
