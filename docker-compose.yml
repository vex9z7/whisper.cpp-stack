services:
  whisper:
    image: ${WHISPER_CPU_IMAGE:-ghcr.io/ggml-org/whisper.cpp:main}
    container_name: ${WHISPER_CONTAINER_NAME:-whisper-cpp}
    restart: unless-stopped
    ports:
      - "${WHISPER_BIND_ADDR:-127.0.0.1}:${WHISPER_HOST_PORT:-2022}:${WHISPER_CONTAINER_PORT:-2022}"
    volumes:
      - ./models:/models:ro
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=512m,mode=1777
    command:
      - whisper-server
      - --host
      - 0.0.0.0
      - --port
      - "${WHISPER_CONTAINER_PORT:-2022}"
      - -m
      - /models/${WHISPER_MODEL_FILE:-ggml-small.bin}
      - --convert
      - --inference-path
      - ${WHISPER_INFERENCE_PATH:-/v1/audio/transcriptions}
      - --processors
      - "${WHISPER_PROCESSORS:-1}"
      - --threads
      - "${WHISPER_THREADS:-4}"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${WHISPER_CONTAINER_PORT:-2022}/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
