name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and config checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check formatting basics
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import sys

          allowed_suffixes = {
              ".env", ".example", ".gitignore", ".md", ".yml", ".yaml", ".mk"
          }
          allowed_names = {"Makefile", "LICENSE"}
          skip_dirs = {".git", "models", "recordings", "examples"}
          failures: list[str] = []

          for path in sorted(Path(".").rglob("*")):
              if not path.is_file():
                  continue
              if any(part in skip_dirs for part in path.parts):
                  continue
              if path.name not in allowed_names and path.suffix not in allowed_suffixes:
                  continue

              data = path.read_bytes()
              rel = path.as_posix()
              if data and not data.endswith(b"\n"):
                  failures.append(f"{rel}: missing trailing newline")
              for lineno, line in enumerate(data.splitlines(), start=1):
                  if line.rstrip(b" \t") != line:
                      failures.append(f"{rel}:{lineno}: trailing whitespace")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Validate Makefile defaults
        shell: bash
        run: |
          set -euo pipefail
          make init
          make check
          make -n download >/dev/null
          make -n up >/dev/null

      - name: Validate Compose configs
        shell: bash
        run: |
          set -euo pipefail
          WHISPER_MODEL_FILE=ggml-small.bin docker compose -f docker-compose.yml config >/tmp/compose.cpu.yml
          WHISPER_MODEL_FILE=ggml-small.bin docker compose -f docker-compose.yml -f docker-compose.vulkan.yml config >/tmp/compose.vulkan.yml
          WHISPER_MODEL_FILE=ggml-small.bin docker compose -f docker-compose.yml -f docker-compose.cuda.yml config >/tmp/compose.cuda.yml

  smoke-cpu:
    name: CPU smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Initialize config
        run: make init

      - name: Download lightweight model
        run: make download MODEL=small

      - name: Start CPU service
        run: |
          make up MODEL=small BACKEND=cpu
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs whisper

      - name: Wait for service health
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..60}; do
            if make health; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f docker-compose.yml ps
          docker compose -f docker-compose.yml logs whisper
          exit 1

      - name: Verify configured model
        run: docker compose -f docker-compose.yml logs whisper | grep -F "/models/ggml-small.bin"

      - name: Transcribe sample
        run: make smoke

      - name: Show logs
        if: always()
        run: docker compose -f docker-compose.yml logs whisper || true

      - name: Stop service
        if: always()
        run: make down MODEL=small BACKEND=cpu || true
